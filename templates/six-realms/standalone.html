<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18242e"><title>山河制图台 · 群雄逐鹿</title><link rel="stylesheet" href="workbench.css?v=1"></head>
<body>
<header class="app-header">
  <a class="brand" href="../../" aria-label="山河制图台地图库"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M3 25 11 9l5 9 4-13 9 20H3Z"/><path d="m8 25 6-8 5 8M20 5l2 9 4 3"/></svg></span><span><strong>山河制图台</strong><small>群雄逐鹿 · 地图工作台</small></span></a>
  <div class="header-note"><span class="status-dot"></span>六国争中原<span class="header-divider"></span><span>基础模板</span></div>
  <a class="project-tag" href="../../" style="text-decoration:none">← 地图库 · 1 号</a>
</header>
<main class="workspace">
  <section class="viewport-panel" aria-label="地图画布">
    <header class="viewport-toolbar"><div class="canvas-heading"><span class="canvas-symbol" aria-hidden="true">⌖</span><h1 id="modeLabel">可变领地图层</h1></div><span class="ratio-badge">9 <span>:</span> 16 <i></i> 等比例取景</span></header>
    <div class="map-area">
      <span class="axis-note" aria-hidden="true">PORTRAIT / 9:16</span>
      <div class="map"><canvas id="map" aria-label="地图地形与领地颜色"></canvas><canvas id="units" aria-label="点击相邻地块发起进攻"></canvas><div id="template-source" class="template-guide"></div><div id="template-audience" class="template-guide"></div><div id="template-safe" class="template-guide"><div id="template-top"><span>上方安全区 · 5%</span></div><div id="template-gift"><span>下方安全区 · 礼物与说明</span></div></div></div>
      <span class="canvas-corner corner-tl" aria-hidden="true"></span><span class="canvas-corner corner-br" aria-hidden="true"></span>
    </div>
    <footer class="canvas-footer"><span><i class="legend-line source"></i>未裁剪画面</span><span><i class="legend-line audience"></i>观众范围</span><span><i class="legend-line safe"></i>上下安全区</span></footer>
  </section>
  <aside class="inspector" aria-label="地图操作面板">
    <section class="panel-section stages-section"><div class="section-heading"><h2>地图的三个阶段</h2><span>同一张图，逐步成形</span></div>
      <nav class="stage-tabs" aria-label="地图阶段">
        <button data-mode="base" aria-pressed="false"><span class="stage-thumb terrain"></span><span class="stage-number">01</span><b>原始地形</b><small>大陆与海域</small></button>
        <button data-mode="target" aria-pressed="false"><span class="stage-thumb colored"></span><span class="stage-number">02</span><b>彩色分区</b><small>国界与配色</small></button>
        <button data-mode="live" aria-pressed="true"><span class="stage-thumb dynamic"></span><span class="stage-number">03</span><b>动态领地</b><small>推进与吞噬</small></button>
      </nav>
    </section>
    <section class="panel-section guides-section"><div class="section-heading"><h2>直播取景辅助</h2><span class="tiny-tag">仅辅助显示</span></div>
      <div class="template-switches">
        <label><span class="guide-icon source-icon" aria-hidden="true"></span><span class="switch-copy"><b>完整画面</b><small>9:16 · 主播采集范围</small></span><input type="checkbox" data-guide="source" checked aria-label="9:16 未裁剪画面"><span class="switch" aria-hidden="true"></span></label>
        <label><span class="guide-icon audience-icon" aria-hidden="true"></span><span class="switch-copy"><b>观众可见范围</b><small>左右各裁 10% · 保留中间 80%</small></span><input type="checkbox" data-guide="audience" checked aria-label="观众可见范围"><span class="switch" aria-hidden="true"></span></label>
        <label><span class="guide-icon safe-icon" aria-hidden="true"></span><span class="switch-copy"><b>上下安全区</b><small>顶部 5% · 底部礼物与说明</small></span><input type="checkbox" data-guide="safe" checked aria-label="上下安全区"><span class="switch" aria-hidden="true"></span></label>
      </div>
    </section>
    <section class="panel-section demo-section"><div class="section-heading"><h2>吞噬演示</h2><span class="duration">20 <small>秒 / 地块</small></span></div>
      <p class="section-description">观察小兵抵达边界后，领地颜色如何逐步推进。</p>
      <button class="primary" id="demo" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 9 6-9 6Z"/></svg>播放 20 秒推进</button>
      <div class="secondary-actions"><button id="pause" disabled>暂停</button><button id="reset" disabled>恢复原貌</button></div>
      <div class="simulation-status"><div class="status-heading"><span class="status-dot"></span>推进状态</div><div id="status" role="status">正在载入底图与领地数据…</div><div class="bar"><span id="progress"></span></div></div>
      <div class="map-tip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 3 3 17 4-6 7-2L5 3Z"/></svg><p>也可直接点地图：<br><strong>选择出兵领地 → 选择相邻目标</strong></p></div>
    </section>
    <footer class="inspector-footer">当前为地图图层演示<br>暂不包含英雄、战损与礼物结算</footer>
  </aside>
</main>
<script type="module" src="app.mjs?v=4"></script><script type="module" src="guides.mjs"></script>
</body></html>
